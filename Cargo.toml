[package]
name = "lazydon"
version = "0.1.0"
edition = "2021"
description = "A Vim-inspired Mastodon terminal client"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
ratatui = "0.29"
crossterm = "0.28"
html2text = "0.14"
