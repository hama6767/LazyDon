name: Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package Linux x86_64 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/release/lazydon README.md LICENSE dist/package/
          printf 'Source commit: %s\n' "$GITHUB_SHA" > dist/package/BUILD.txt
          tar -C dist/package -czf dist/lazydon-linux-x86_64.tar.gz .
          (cd dist && sha256sum lazydon-linux-x86_64.tar.gz > lazydon-linux-x86_64.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: lazydon-linux-x86_64
          path: |
            dist/lazydon-linux-x86_64.tar.gz
            dist/lazydon-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
