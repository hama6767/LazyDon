name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Verify binary architecture
        run: test "$(lipo -archs target/release/lazydon)" = arm64
      - name: Package macOS Apple Silicon build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/release/lazydon README.md README.ja.md LICENSE dist/package/
          printf 'Source commit: %s\n' "$GITHUB_SHA" > dist/package/BUILD.txt
          tar -C dist/package -czf dist/lazydon-macos-aarch64.tar.gz .
          (cd dist && shasum -a 256 lazydon-macos-aarch64.tar.gz > lazydon-macos-aarch64.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: lazydon-macos-aarch64
          path: |
            dist/lazydon-macos-aarch64.tar.gz
            dist/lazydon-macos-aarch64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
